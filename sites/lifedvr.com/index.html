<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeDVR - Remember Everything</title>
    <meta name="description" content="LifeDVR - Rewind, replay, remember. Your life, on demand." />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        color: rgba(30, 10, 50, 0.87);
        background: #f0e8f8;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: -10%;
        z-index: -1;
        background: url('/life_dvr.png') center center / cover no-repeat;
        animation: bg-drift 30s ease-in-out infinite alternate;
      }

      @keyframes bg-drift {
        0% {
          transform: scale(1.05) translate(0, 0);
        }
        33% {
          transform: scale(1.08) translate(1%, -1%);
        }
        66% {
          transform: scale(1.06) translate(-1%, 0.5%);
        }
        100% {
          transform: scale(1.1) translate(0.5%, 1%);
        }
      }

@keyframes glow-pulse {
        0%, 100% {
          text-shadow:
            0 0 10px rgba(255, 0, 128, 0.4),
            0 0 30px rgba(255, 0, 128, 0.2);
        }
        50% {
          text-shadow:
            0 0 20px rgba(0, 200, 255, 0.6),
            0 0 50px rgba(128, 0, 255, 0.3),
            0 0 80px rgba(255, 0, 128, 0.2);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% center;
        }
        100% {
          background-position: 200% center;
        }
      }

      @media (prefers-reduced-motion) {
        *,
        ::before,
        ::after {
          animation: none !important;
        }
      }

      .content {
        max-width: 56rem;
        margin: 0 auto;
        padding: 3rem;
        text-align: center;
        position: relative;
        z-index: 10;
        background: rgba(255, 255, 255, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-radius: 1.5rem;
        border: 1px solid rgba(255, 255, 255, 0.3);
      }

h1 {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        animation: glow-pulse 4s ease-in-out infinite;
        background: linear-gradient(135deg, #ff0080, #00c8ff, #8000ff, #ff0080);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 6s linear infinite, glow-pulse 4s ease-in-out infinite;
      }

      h2 {
        font-size: 1.5rem;
        font-weight: 400;
        margin: 1.25rem 0;
        line-height: 1.4;
        opacity: 0.85;
        letter-spacing: 0.02em;
      }

      .tagline {
        font-size: 1.125rem;
        color: #d6006f;
        font-weight: 700;
        margin: 1.5rem 0 0.5rem;
      }

      .small {
        font-size: 0.75rem;
        margin: 1rem 0;
        line-height: 1.4;
        opacity: 0.5;
      }

      .features {
        display: flex;
        gap: 2rem;
        justify-content: center;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .feature {
        font-size: 0.875rem;
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .feature i[data-lucide] {
        width: 1.25rem;
        height: 1.25rem;
        color: #d6006f;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <h1>LifeDVR</h1>
      <h2>Rewind, replay, remember.<br />Your life, on demand.</h2>
      <p class="tagline">Never forget those fun times.</p>
      <div class="features">
        <div class="feature"><i data-lucide="rewind"></i> Rewind</div>
        <div class="feature"><i data-lucide="play"></i> Replay</div>
        <div class="feature"><i data-lucide="bookmark"></i> Remember</div>
      </div>
    </div>
    <script>lucide.createIcons();</script>
  </body>
</html>
