<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LifeDVR - Remember Everything</title>
    <meta name="description" content="LifeDVR - Rewind, replay, remember. Your life, on demand." />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏪</text></svg>" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        color: rgba(255, 255, 255, 0.87);
        background: #1a0a2e;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }

      /* Disco moving background */
      body::before {
        content: "";
        position: fixed;
        inset: -50%;
        z-index: -2;
        background:
          radial-gradient(circle at 20% 50%, rgba(255, 0, 128, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(0, 200, 255, 0.15) 0%, transparent 50%),
          radial-gradient(circle at 50% 80%, rgba(255, 200, 0, 0.12) 0%, transparent 50%),
          radial-gradient(circle at 70% 60%, rgba(128, 0, 255, 0.12) 0%, transparent 50%);
        animation: disco-drift 20s ease-in-out infinite alternate;
        pointer-events: none;
      }

      /* Grid pattern overlay that slides */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.06;
        background-image:
          repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(255, 255, 255, 0.5) 39px, rgba(255, 255, 255, 0.5) 40px),
          repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(255, 255, 255, 0.5) 39px, rgba(255, 255, 255, 0.5) 40px);
        background-size: 40px 40px;
        transform: rotate(-12deg) scale(1.35);
        animation: slide 30s linear infinite;
        pointer-events: none;
      }

      @keyframes disco-drift {
        0% {
          transform: translate(0, 0) rotate(0deg);
        }
        33% {
          transform: translate(5%, -3%) rotate(2deg);
        }
        66% {
          transform: translate(-3%, 5%) rotate(-1deg);
        }
        100% {
          transform: translate(2%, 2%) rotate(1deg);
        }
      }

      @keyframes slide {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 40px 40px;
        }
      }

      @keyframes glow-pulse {
        0%, 100% {
          text-shadow:
            0 0 10px rgba(255, 0, 128, 0.4),
            0 0 30px rgba(255, 0, 128, 0.2);
        }
        50% {
          text-shadow:
            0 0 20px rgba(0, 200, 255, 0.6),
            0 0 50px rgba(128, 0, 255, 0.3),
            0 0 80px rgba(255, 0, 128, 0.2);
        }
      }

      @keyframes shimmer {
        0% {
          background-position: -200% center;
        }
        100% {
          background-position: 200% center;
        }
      }

      @media (prefers-reduced-motion) {
        *,
        ::before,
        ::after {
          animation: none !important;
        }
      }

      .content {
        max-width: 56rem;
        margin: 0 auto;
        padding: 2rem;
        text-align: center;
        position: relative;
        z-index: 10;
      }

      .dvr-icon {
        font-size: 4rem;
        margin-bottom: 1rem;
        animation: glow-pulse 3s ease-in-out infinite;
        display: inline-block;
      }

      h1 {
        font-size: 4rem;
        font-weight: 800;
        line-height: 1.1;
        letter-spacing: -0.02em;
        animation: glow-pulse 4s ease-in-out infinite;
        background: linear-gradient(135deg, #ff0080, #00c8ff, #8000ff, #ff0080);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: shimmer 6s linear infinite, glow-pulse 4s ease-in-out infinite;
      }

      h2 {
        font-size: 1.5rem;
        font-weight: 400;
        margin: 1.25rem 0;
        line-height: 1.4;
        opacity: 0.85;
        letter-spacing: 0.02em;
      }

      .tagline {
        font-size: 1.125rem;
        color: #ff69b4;
        font-weight: 700;
        margin: 1.5rem 0 0.5rem;
      }

      .small {
        font-size: 0.75rem;
        margin: 1rem 0;
        line-height: 1.4;
        opacity: 0.5;
      }

      .features {
        display: flex;
        gap: 2rem;
        justify-content: center;
        margin-top: 2rem;
        flex-wrap: wrap;
      }

      .feature {
        font-size: 0.875rem;
        opacity: 0.7;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }

      .feature span {
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="dvr-icon">&#x23EA;</div>
      <h1>LifeDVR</h1>
      <h2>Rewind, replay, remember.<br />Your life, on demand.</h2>
      <p class="tagline">Never forget the moments that matter.</p>
      <div class="features">
        <div class="feature"><span>&#x23EA;</span> Rewind</div>
        <div class="feature"><span>&#x23F8;</span> Pause</div>
        <div class="feature"><span>&#x25B6;</span> Replay</div>
        <div class="feature"><span>&#x1F4BE;</span> Remember</div>
      </div>
      <p class="small">Coming soon</p>
    </div>
  </body>
</html>
