<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./glitter-mines.png" />
    <title>Glitter Mines</title>
    <meta name="description" content="Glitter Mines" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        color: rgba(255, 255, 255, 0.87);
        background: #242424;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI',
          Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        min-width: 320px;
        min-height: 100vh;
        position: relative;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        opacity: 0.07;
        background: url("./glitter-mines.png");
        background-size: 180px 180px;
        transform: rotate(-12deg) scale(1.35);
        animation: slide 30s linear infinite;
        pointer-events: none;
      }

      @keyframes slide {
        from {
          background-position: 0 0;
        }
        to {
          background-position: 180px 180px;
        }
      }

      @media (prefers-reduced-motion) {
        *,
        ::before,
        ::after {
          animation: none !important;
        }
      }

      .content {
        max-width: 56rem;
        margin: 0 auto;
        padding: 2rem;
        text-align: center;
        position: relative;
        z-index: 10;
      }

      .logo {
        width: 200px;
        height: auto;
        margin: 0 auto 1.5rem;
        filter: invert(1);
        animation: sparkle 3s ease-in-out infinite;
      }

      @keyframes sparkle {
        0%, 100% {
          filter: invert(1) drop-shadow(0 0 8px rgba(255, 105, 180, 0.6));
        }
        50% {
          filter: invert(1) drop-shadow(0 0 20px rgba(255, 105, 180, 1)) drop-shadow(0 0 40px rgba(148, 103, 255, 0.5));
        }
      }

      h1 {
        font-size: 3.25rem;
        font-weight: 700;
        line-height: 1.1;
      }

      h2 {
        font-size: 1.875rem;
        font-weight: 700;
        margin: 1rem 0;
        line-height: 1.2;
      }

      .cta {
        color: #ff69b4;
        font-weight: 700;
      }

      .small {
        font-size: 0.75rem;
        margin: 1rem 0;
        line-height: 1.2;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <img src="./glitter-mines.png" alt="Glitter Mines logo" class="logo" />
      <h1>Glitter Mines</h1>
    </div>
  </body>
</html>
